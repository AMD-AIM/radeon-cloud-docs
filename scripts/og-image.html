<!doctype html>
<!--
  Source for public/og.png, the social preview image. To regenerate, open this
  file in Chrome, set the DevTools device toolbar to 1200 x 630 at 100%, and
  use "Capture screenshot".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@500&display=block">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    padding: 72px 80px;
    background: #0b0d10;
    color: #f7f8fa;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(#1e232c 1px, transparent 1px),
      linear-gradient(90deg, #1e232c 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 75% 70% at 25% 0%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 75% 70% at 25% 0%, #000 0%, transparent 75%);
  }
  main { position: relative; height: 100%; display: flex; flex-direction: column; }
  .logo { height: 40px; width: auto; align-self: flex-start; }
  .eyebrow {
    display: flex; align-items: center; gap: 12px;
    margin-top: 92px;
    font: 600 18px 'Space Grotesk', sans-serif;
    letter-spacing: 0.12em; text-transform: uppercase; color: #868d9b;
  }
  .eyebrow::before {
    content: ''; width: 10px; height: 10px; border-radius: 50%;
    background: #3ddc97; box-shadow: 0 0 0 5px rgba(61, 220, 151, 0.18);
  }
  h1 {
    margin-top: 22px;
    font: 700 96px/1 'Space Grotesk', sans-serif;
    letter-spacing: -0.04em;
  }
  h1 em { font-style: normal; color: #ff2d45; }
  .zh {
    margin-top: 18px;
    font: 500 40px/1.2 'Space Grotesk', 'Noto Sans SC', sans-serif;
    letter-spacing: -0.01em; color: #b9bec9;
  }
  .foot {
    margin-top: auto;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 22px; color: #868d9b;
  }
  .foot code { font: 400 20px 'IBM Plex Mono', monospace; color: #b9bec9; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #e8112d; }
</style>
</head>
<body>
  <main>
    <img class="logo" src="../src/assets/amd-logo-white.png" alt="AMD">
    <p class="eyebrow">GPU instances · Token Factory · API</p>
    <h1><em>Radeon</em> Cloud Docs</h1>
    <p class="zh" lang="zh-CN">Radeon Cloud 文档</p>
    <div class="foot">
      <span>English · 简体中文</span>
      <code>amd-aim.github.io/radeon-cloud-docs</code>
    </div>
  </main>
  <div class="bar"></div>
</body>
</html>
